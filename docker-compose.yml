version: '3.8'

services:
  trading-bot:
    build: .
    container_name: crypto-trading-bot
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./trading_bot.db:/app/trading_bot.db
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
